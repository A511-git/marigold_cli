[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marigold-panorama-cli"
version = "1.0.0"
description = "GPU-accelerated Standalone Marigold 360° Panorama Depth Estimation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.28.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.21.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0,<5.0.0",
    "imageio>=2.30.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "omegaconf>=2.3.0",
    "trimesh>=4.0.0",
]

[project.scripts]
marigold-panorama = "standalone_marigold.infer_panorama:main"

[tool.setuptools.packages.find]
include = ["standalone_marigold*"]

[tool.ruff]
line-length = 100
target-version = "py310"
